name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # daily: the live catalog test also checks that the API is up
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
